<style>
:root{--c:#1F2328;--ink:#1F2328;--mut:#5B6470;--line:#ECEEF1;--or:#B54200}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Montserrat,Arial,sans-serif;background:#EEF1F3;color:var(--ink);min-height:100vh}
button,a{font-family:inherit}
.bar{display:grid;grid-template-columns:26fr 15fr 15fr 30fr 14fr;height:6px}.bar i:nth-child(1){background:#E75300}.bar i:nth-child(2){background:#F2A20C}.bar i:nth-child(3){background:#7B2230}.bar i:nth-child(4){background:#0E9AA0}.bar i:nth-child(5){background:#9A6B6F}
.top{background:var(--c);color:#fff;padding:0 0 56px}
.brand{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 0}.brand .lg{height:30px;width:auto;display:block}.brand span{font-size:12px;font-weight:600;color:#C9CED5}
.who{padding:20px 20px 0}.who .k{font-size:13px;font-weight:700;color:#FFB27A;letter-spacing:.08em;text-transform:uppercase}.who h1{margin:6px 0 4px;font-size:24px;font-weight:800;line-height:1.15}.who .r{font-size:15px;font-weight:700;color:#DDE1E6}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:0 16px 0 10px;font-size:13px;font-weight:700;cursor:pointer;margin:12px 0 0 12px}
.ttl{padding:16px 20px 0}.ttl .k{font-size:13px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.06em}.ttl h1{margin:4px 0 0;font-size:24px;font-weight:800}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 24px;position:relative;z-index:1}
.card{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:16px;margin-top:14px}.card.up{margin-top:-40px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid div{background:#F5F6F8;border-radius:10px;padding:9px 11px}.grid span{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}.grid b{font-size:14px;font-weight:700}.full{grid-column:1/-1}
h2{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--or);text-transform:uppercase;letter-spacing:.06em}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:22px 2px 8px}.hd small{font-size:12px;color:var(--mut);font-weight:600}
.lst{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;background:#fff;border:1px solid #E3E6EA;border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);color:var(--ink)}
.sg{width:48px;height:48px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.li .n{font-size:15px;font-weight:800}.li .m{margin-top:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.li .m small{font-size:12px;color:var(--mut);font-weight:600}
.pill{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.s-ok{background:#E3F4EA;color:#17733F}.s-warn{background:#FFF1CC;color:#7A5200}.s-w15{background:#FFDDBF;color:#A33F00}.s-bad{background:#FBE0DE;color:#B42318}
.st{border-radius:12px;padding:14px;text-align:center}.st b{display:block;font-size:24px;font-weight:800;letter-spacing:.02em}.st small{display:block;font-size:13px;font-weight:600;margin-top:3px}
.nm{text-align:center;margin-top:14px}.nm b{display:block;font-size:18px;font-weight:800}.nm span{font-size:14px;font-weight:700;color:var(--mut)}
.req{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.req:last-child{border-bottom:0}.req .n{font-size:14px;font-weight:700}.req .f{font-size:12px;color:var(--mut);margin-top:2px}.req .pill{font-size:12px;padding:4px 10px}
.oth{display:flex;gap:8px;flex-wrap:wrap}.oth button{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:1px solid #E3E6EA;background:#fff;border-radius:999px;padding:0 14px 0 6px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}.oth i{width:32px;height:32px;border-radius:999px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal}
.foot{text-align:center;font-size:11px;color:var(--mut);line-height:1.5;padding:20px 10px 10px}
.msg{text-align:center;padding:30px 10px}.msg b{display:block;font-size:20px;margin-bottom:8px}
@media (max-width:360px){.grid{grid-template-columns:1fr}.st b{font-size:21px}}

const bar='<div class="bar"><i></i><i></i><i></i><i></i><i></i></div>';
let W=null,G=null,SEL=null;
function fail(t,m){$('root').innerHTML=`<div class="top">${bar}<div class="brand">${LGI}<span>Licencias Internas</span></div><div class="who"><div class="k">Licencias Internas División Ventanas</div></div></div><div class="wrap"><div class="card up msg"><b>${esc(t)}</b>${esc(m||'')}</div></div>`}
/* estado de una licencia, calculado con la fecha de hoy */
function stat(l){
  const items=(l.it||[]).filter(i=>i.n!=='Vigencia de la licencia').map(i=>{const o=Object.assign({},i);o.f=pd(i.f);if(i.t==='vig'){o.d=o.f?days(o.f):null;o.st=!o.f?'falta':o.d<0?'vencido':o.d<=15?'15':o.d<=30?'30':'ok'}else o.st=i.ok?'ok':'falta';return o});
  const vig=items.filter(i=>i.t==='vig'&&i.f).sort((a,b)=>a.f-b.f);const prox=vig[0]||null;
  const venc=items.filter(i=>i.st==='vencido'),falta=items.filter(i=>i.st==='falta');
  let st,cls,sub='',hasta;
  if(l.est==='Revocada'){st='REVOCADA';cls='bad';sub='Esta licencia fue revocada'}else if(l.est==='Suspendida'){st='SUSPENDIDA';cls='bad';sub='Licencia suspendida temporalmente'}
  else if(venc.length){st='VENCIDA';cls='bad';sub='Vencido: '+venc.map(i=>i.n).join(', ')}else if(falta.length){st='NO HABILITADA';cls='bad';sub='Pendiente: '+falta.map(i=>i.n).join(', ')}
  else if(prox&&prox.d<=15){st=prox.d===0?'VENCE HOY':'VENCE EN '+prox.d+' DÍA'+(prox.d===1?'':'S');cls='w15';sub=prox.n+' vence el '+fd(prox.f)}
  else if(prox&&prox.d<=30){st='VENCE EN '+prox.d+' DÍAS';cls='warn';sub=prox.n+' vence el '+fd(prox.f)}
  else{st='VIGENTE';cls='ok';sub=prox?'Habilitada hasta el '+fd(prox.f)+' ('+prox.n+')':'Requisitos completos'}
  hasta=prox?'Hasta '+fd(prox.f):(items.some(i=>i.t==='vig')?'Vigencia pendiente':'Sin vencimiento');
  return{items,st,cls,sub,hasta,vig:prox?fd(prox.f):(items.some(i=>i.t==='vig')?'Pendiente':'Sin vencimiento')};
}
const pillReq=i=>i.t==='vig'?(i.st==='falta'?'<span class="pill s-bad">Sin registro</span>':i.st==='vencido'?'<span class="pill s-bad">Vencido</span>':i.st==='15'?`<span class="pill s-w15">${i.d} días</span>`:i.st==='30'?`<span class="pill s-warn">${i.d} días</span>`:'<span class="pill s-ok">Vigente</span>'):(i.ok?'<span class="pill s-ok">✔ Realizado</span>':'<span class="pill s-bad">✘ No realizado</span>');
const foot=()=>`<div class="foot">Registro de Licencias Internas · Dirección de Seguridad y Salud Ocupacional, Codelco División Ventanas.<br>Datos publicados el ${fd(pd(G))} · consultado el ${fd(new Date())}.</div>`;
function cell(k,v,full){return `<div${full?' class="full"':''}><span>${k}</span><b>${esc(v||'—')}</b></div>`}
function renderList(){
  document.documentElement.style.setProperty('--c','#1F2328');
  const L=W.lics;const al=L.filter(l=>stat(l).cls!=='ok').length;
  $('root').innerHTML=`<div class="top">${bar}<div class="brand">${LGI}<span>Licencias Internas</span></div>
   <div class="who"><div class="k">Licencias Internas División Ventanas</div><h1>${esc(W.n)}</h1><div class="r">${esc(W.r)}</div></div></div>
   <div class="wrap"><div class="card up"><div class="grid">${cell('Empresa',W.e)}${cell('Grupo',W.g)}${cell('Cargo',W.c)}${cell('Gerencia / Superint.',W.ger)}</div></div>
   <div class="hd"><h2 style="margin:0">Sus licencias (${L.length})</h2><small>${L.length>1?'Toca una para ver el detalle':''}${al?` · ${al} con alerta`:''}</small></div>
   <div class="lst">${L.map((l,i)=>{const s=stat(l);return `<button class="li" data-i="${i}"><div class="sg" style="background:${COL[l.tp]||'#555'}">${SIG[l.tp]||esc(l.tp)}</div><div style="flex-grow:1;min-width:0"><div class="n">${esc(l.tn)}</div><div class="m"><span class="pill s-${s.cls}">${esc(s.st)}</span><small>${esc(s.hasta)}</small></div></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A929C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>`}).join('')}</div>
   ${L.length?'':'<div class="card msg">Este trabajador no tiene licencias internas registradas.</div>'}${foot()}</div>`;
  document.querySelectorAll('.li').forEach(b=>b.onclick=()=>{SEL=+b.dataset.i;render();window.scrollTo(0,0)});
}
function renderDetail(){
  const l=W.lics[SEL],s=stat(l);document.documentElement.style.setProperty('--c',COL[l.tp]||'#1F2328');
  const others=W.lics.map((x,i)=>[x,i]).filter(([,i])=>i!==SEL);
  $('root').innerHTML=`<div class="top">${bar}${W.lics.length>1?`<button class="back" id="bk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Todas las licencias</button>`:`<div class="brand">${LGI}<span>Licencias Internas</span></div>`}
   <div class="ttl"><div class="k">Licencia interna</div><h1>${esc(l.tn)}</h1></div></div>
   <div class="wrap"><div class="card up"><div class="st s-${s.cls}"><b>${esc(s.st)}</b><small>${esc(s.sub)}</small></div>
    <div class="nm"><b>${esc(W.n)}</b><span>${esc(W.r)} · ${esc(W.e)}</span></div>
    <div class="grid" style="margin-top:14px">${cell('Vigencia',s.vig)}${cell('N° licencia',l.id)}${cell('Cargo',W.c)}${cell('Grupo',W.g)}${cell('Gerencia / Superintendencia',W.ger,1)}${cell('Emisión',fd(pd(l.emi)))}${cell('Empresa',W.e)}</div></div>
   <div class="card"><h2>Requisitos de esta licencia</h2>${s.items.map(i=>`<div class="req"><div><div class="n">${esc(i.n)}</div>${i.f?`<div class="f">${i.t==='vig'?'Vigente hasta ':'Realizado el '}${fd(i.f)}</div>`:''}</div>${pillReq(i)}</div>`).join('')}</div>
   ${others.length?`<div class="card"><h2 style="margin-bottom:10px">Otras licencias del trabajador</h2><div class="oth">${others.map(([x,i])=>{const so=stat(x);return `<button data-i="${i}"><i style="background:${COL[x.tp]||'#555'}">${SIG[x.tp]||''}</i>${esc(CORTO[x.tp]||x.tn)} <span class="pill s-${so.cls}">${so.cls==='ok'?'✔':'!'}</span></button>`}).join('')}</div></div>`:''}
   ${foot()}</div>`;
  const bk=$('bk');if(bk)bk.onclick=()=>{SEL=null;render();window.scrollTo(0,0)};
  document.querySelectorAll('.oth button').forEach(b=>b.onclick=()=>{SEL=+b.dataset.i;render();window.scrollTo(0,0)});
}
function render(){if(SEL==null)renderList();else renderDetail()}
async function main(){
  const h=decodeURIComponent(location.hash.slice(1));const p=h.split('.');
  if(p.length!==2||!p[0]||!p[1])return fail('Código no válido','Escanea nuevamente el código QR de la credencial.');
  let q;try{const r=await fetch('data/q.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;q=await r.json()}catch(e){return fail('Sin conexión','No fue posible consultar el registro de licencias. Intenta nuevamente.')}
  const e=q.e&&q.e[p[0]];if(!e)return fail('Credencial no registrada','Este código no corresponde a un trabajador con licencias en el registro de la División Ventanas.');
  let d;try{const k=await crypto.subtle.importKey('raw',b64(p[1]),'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},k,b64(e.c));d=JSON.parse(new TextDecoder().decode(pt))}
  catch(err){return fail('Código no válido','El código QR está dañado o no corresponde a este registro.')}
  G=q.g;
  if(d.k==='w'){W=d;W.lics=(W.lics||[]).slice().sort((a,b)=>ORD.indexOf(a.tp)-ORD.indexOf(b.tp));SEL=W.lics.length===1?0:null}
  else{W={n:d.n,r:d.r,e:d.e,c:d.c,g:d.g,ger:d.ger,lics:[d]};SEL=0} // QR antiguo de una sola licencia
  render();
}
main();window.addEventListener('hashchange',()=>{SEL=null;main()});
})();
</script></body></html>
