<style>
:root{--c:#0E7F7D;--ok:#17733F;--okb:#E3F4EA;--w:#8A5A00;--wb:#FFF1CC;--w15:#A33F00;--w15b:#FFDDBF;--bad:#B42318;--badb:#FBE0DE;--ink:#1F2328;--mut:#5B6470;--line:#E6E8EB}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Montserrat,Arial,sans-serif;background:#EEF1F3;color:var(--ink);min-height:100vh}
.top{background:var(--c);color:#fff;padding:18px 16px 64px;text-align:center;position:relative}
.top .bar{position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#E75300 0 26%,#F2A20C 26% 41%,#7B2230 41% 56%,#0E9AA0 56% 86%,#9A6B6F 86%)}
.top img{height:44px;margin-top:8px}.top h1{margin:10px 0 2px;font-size:24px;font-weight:800;letter-spacing:.01em}.top .tp{font-size:16px;font-weight:600;opacity:.95}
.wrap{max-width:560px;margin:-44px auto 24px;padding:0 14px;position:relative;z-index:1}
.card{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:18px 18px 16px;margin-bottom:14px}
.st{border-radius:12px;padding:16px;text-align:center;font-weight:800;font-size:26px;letter-spacing:.02em}
.st small{display:block;font-size:13px;font-weight:600;margin-top:4px;letter-spacing:0}
.s-ok{background:var(--okb);color:var(--ok)}.s-warn{background:var(--wb);color:var(--w)}.s-w15{background:var(--w15b);color:var(--w15)}.s-bad{background:var(--badb);color:var(--bad)}
.name{font-size:21px;font-weight:800;margin:16px 0 2px;text-align:center}.rut{text-align:center;color:var(--mut);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.grid div{background:#F6F7F9;border-radius:10px;padding:9px 11px}.grid span{display:block;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}.grid b{font-size:14px}
.full{grid-column:1/-1}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#E75300;margin:0 0 10px}
.req{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.req:last-child{border-bottom:0}
.req .n{font-weight:600;font-size:14px}.req .f{font-size:12px;color:var(--mut);margin-top:2px}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.foot{text-align:center;font-size:12px;color:var(--mut);line-height:1.5;padding:0 10px}
.msg{text-align:center;padding:30px 10px}.msg b{display:block;font-size:20px;margin-bottom:8px}
@media (max-width:380px){.grid{grid-template-columns:1fr}.st{font-size:22px}}
</style></head><body>

h1>Licencia Interna</h1><div class="tp" id="tp">Verificando…</div></div>
<div class="wrap" id="app"><div class="card msg">Cargando datos de la licencia…</div></div>
<script>
(function(){
const COL={PG:'#0E7F7D',ALT:'#5F8F57',TEC:'#3F8A42'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const pd=s=>{if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fd=d=>d?pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear():'—';
const t0=new Date();t0.setHours(0,0,0,0);
const days=d=>Math.round((d-t0)/864e5);
const b64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
function fail(t,m){$('tp').textContent='';$('app').innerHTML='<div class="card msg"><b>'+esc(t)+'</b>'+esc(m||'')+'</div>'}
async function main(){
  const h=decodeURIComponent(location.hash.slice(1));const p=h.split('.');
  if(p.length!==2||!p[0]||!p[1])return fail('Código no válido','Escanea nuevamente el código QR de la licencia.');
  let q;try{const r=await fetch('data/q.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;q=await r.json()}catch(e){return fail('Sin conexión','No fue posible consultar el registro de licencias. Intenta nuevamente.')}
  const e=q.e&&q.e[p[0]];if(!e)return fail('Licencia no registrada','Este código no corresponde a una licencia vigente en el registro de la División Ventanas.');
  let d;try{const k=await crypto.subtle.importKey('raw',b64(p[1]),'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)},k,b64(e.c));d=JSON.parse(new TextDecoder().decode(pt))}
  catch(err){return fail('Código no válido','El código QR está dañado o no corresponde a esta licencia.')}
  const c=COL[d.tp]||'#0E7F7D';document.documentElement.style.setProperty('--c',c);$('tp').textContent=d.tn;
  const items=(d.it||[]).map(i=>{const o=Object.assign({},i);if(i.t==='vig'){o.f=pd(i.f);o.d=o.f?days(o.f):null;o.st=!o.f?'falta':o.d<0?'vencido':o.d<=15?'15':o.d<=30?'30':'ok'}else o.st=i.ok?'ok':'falta';return o});
  const vig=items.filter(i=>i.t==='vig'&&i.f).sort((a,b)=>a.f-b.f);const prox=vig[0]||null;
  const venc=items.filter(i=>i.st==='vencido'),falta=items.filter(i=>i.st==='falta');
  let st,cls,sub='';
  if(d.est==='Revocada'){st='REVOCADA';cls='bad';sub='Esta licencia fue revocada'}else if(d.est==='Suspendida'){st='SUSPENDIDA';cls='bad';sub='Licencia suspendida temporalmente'}
  else if(venc.length){st='VENCIDA';cls='bad';sub='Vencido: '+venc.map(i=>i.n).join(', ')}else if(falta.length){st='NO HABILITADA';cls='bad';sub='Pendiente: '+falta.map(i=>i.n).join(', ')}
  else if(prox&&prox.d<=15){st='VIGENTE';cls='w15';sub=prox.n+' vence en '+prox.d+' día'+(prox.d===1?'':'s')}else if(prox&&prox.d<=30){st='VIGENTE';cls='warn';sub=prox.n+' vence en '+prox.d+' días'}else{st='VIGENTE';cls='ok';sub=prox?'Habilitada hasta el '+fd(prox.f)+(prox.n!=='Vigencia de la licencia'?' ('+prox.n+')':''):''}
  const lv=items.find(i=>i.n==='Vigencia de la licencia');
  const pill=i=>i.t==='vig'?(i.st==='falta'?'<span class="pill s-bad">Sin registro</span>':i.st==='vencido'?'<span class="pill s-bad">Vencido</span>':i.st==='15'?'<span class="pill s-w15">'+i.d+' días</span>':i.st==='30'?'<span class="pill s-warn">'+i.d+' días</span>':'<span class="pill s-ok">Vigente</span>'):(i.ok?'<span class="pill s-ok">✔ Realizado</span>':'<span class="pill s-bad">✘ No realizado</span>');
  $('app').innerHTML=`<div class="card"><div class="st s-${cls}">${esc(st)}<small>${esc(sub)}</small></div>
   <div class="name">${esc(d.n)}</div><div class="rut">${esc(d.r)}</div>
   <div class="grid"><div><span>Empresa</span><b>${esc(d.e)}</b></div><div><span>Vigencia licencia</span><b>${fd(lv&&lv.f)}</b></div>
   <div><span>Cargo</span><b>${esc(d.c||'—')}</b></div><div><span>Grupo</span><b>${esc(d.g||'—')}</b></div>
   <div class="full"><span>Gerencia / Superintendencia</span><b>${esc(d.ger||'—')}</b></div>
   <div><span>N° licencia</span><b>${esc(d.id)}</b></div><div><span>Emisión</span><b>${fd(pd(d.emi))}</b></div></div></div>
  <div class="card"><h2>Requisitos y vigencias</h2>${items.filter(i=>i.n!=='Vigencia de la licencia').map(i=>`<div class="req"><div><div class="n">${esc(i.n)}</div>${i.f?`<div class="f">${i.t==='vig'?'Vigente hasta ':'Realizado el '}${fd(i.f instanceof Date?i.f:pd(i.f))}</div>`:''}</div>${pill(i)}</div>`).join('')}</div>
  <div class="foot">Registro de Licencias Internas · Dirección de Seguridad y Salud Ocupacional, Codelco División Ventanas.<br>Datos publicados el ${fd(pd(q.g))} · consultado el ${fd(new Date())}.</div>`;
}
